# Install as /etc/supervisor/conf.d/pcm.conf
[program:pcm-backend]
command=/bin/bash /opt/pcm/current/server/scripts/run-backend.sh
directory=/opt/pcm/current/backend
user=pcm
environment=PCM_ENV_FILE="/opt/pcm/shared/pcm.env",HOME="/home/pcm",USER="pcm"
autostart=true
autorestart=true
startsecs=5
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/var/log/pcm/backend.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
