# Install as /etc/nginx/sites-available/pcm. Replace pcm.example.com.
server {
    listen 80;
    listen [::]:80;
    server_name pcm.example.com;
    root /opt/pcm/current/frontend/dist/pcm/browser;
    index index.html;
    client_max_body_size 11m;
    access_log /var/log/nginx/pcm-access.log;
    error_log /var/log/nginx/pcm-error.log;

    location = /api { return 308 /api/; }
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
    location ~ /\. { deny all; }
    location = /index.html { add_header Cache-Control "no-cache" always; }
    location ~* \.(?:js|css|svg|png|jpg|jpeg|ico|woff2?)$ {
        try_files $uri =404;
        expires 1h;
    }
    location / { try_files $uri $uri/ /index.html; }
}
